; PlatformIO Project Configuration File — cyd-scanner
;
; Two boards, one project:
;   [env:cyd] -> ESP32-2432S028R "CYD"  (host + UI + 2.4 GHz scan + phone link)
;   [env:c5]  -> ESP32-C5 DevKit        (5 GHz / BLE / 802.15.4 scan co-processor)
;
; Each env compiles only its own folder under src/ (build_src_filter).
; Shared UART protocol lives in lib/link_protocol/ and is compiled into both.
;
; Build/flash one board at a time, e.g.:
;   pio run -e cyd -t upload -t monitor
;   pio run -e c5  -t upload -t monitor
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:cyd]
board = jczn_2432s028r
; +<host_common/> pulls in the board-agnostic host core shared with [env:xiao_s3]. rtc.cpp (DS3231, needs
; Wire) is excluded: no RTC on the CYD, and including Wire.h would link ~32 KB of I2C driver.
build_src_filter = +<cyd/> +<host_common/> -<host_common/rtc.cpp>
; BLE peripheral + Wi-Fi AP + web server + TFT exceed the default app partition.
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  h2zero/NimBLE-Arduino@^2.2.0
  https://github.com/ricmoo/QRCode.git
  bblanchon/ArduinoJson@^6.21.5
; TFT_eSPI is configured here (not via User_Setup.h) so the library stays untouched.
; Display: ILI9341 240x320 on the CYD's SPI pins. See hardware/PINOUT.md.
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000

[env:c5]
board = esp32-c5-devkitc-1
build_src_filter = +<c5/>
; Wi-Fi + BLE exceed the default 1.3MB app partition; use the 3MB app scheme (no OTA).
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.0
; Route Serial to the native USB (USB-Serial/JTAG) port used for flashing/console.
; USB_MODE=1 selects the USB-Serial/JTAG (HWCDC) console the C5's native port uses.
; (For the separate UART USB-C port instead, set CDC_ON_BOOT=0.)
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Mini build (screenless XIAO sibling) — see docs/mini-build.md.
;   [env:xiao_s3] -> Seeed XIAO ESP32-S3 Sense  (headless host; replaces the CYD)
;   [env:xiao_c5] -> Seeed XIAO ESP32-C5        (scanner co-proc; replaces the DevKit C5)
; Same SoCs as the CYD/DevKit, so radios + firmware carry over; only pins/UI differ.
; ---------------------------------------------------------------------------

; Headless host — XIAO ESP32-S3 Sense. No TFT/touch/BOOT UI; driven via the web app.
; Shares the host core in src/host_common/; board layer in src/xiao_s3/.
[env:xiao_s3]
board = seeed_xiao_esp32s3
build_src_filter = +<xiao_s3/> +<host_common/>
; BLE + Wi-Fi SoftAP + web server need the 3MB app scheme (8MB flash, plenty of room).
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.0
  bblanchon/ArduinoJson@^6.21.5
; USB-CDC console frees the UART0 pads (GPIO43/44) for the inter-board link.
; (The board def also sets these; restated for clarity.)
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Scanner co-processor — XIAO ESP32-C5. Reuses src/c5/ verbatim; pins.h branches
; on -DARDUINO_XIAO_ESP32C5 (set by the board def) for the link/GPS pins.
[env:xiao_c5]
board = seeed_xiao_esp32c5
build_src_filter = +<c5/>
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; 802.15.4 TEST SOURCE: bench transmitter for a SECOND C5 (NOT the scanner, NOT shipped).
; Sends known frames so the scanner's PH_154 capture has controlled traffic. No Wi-Fi/BLE.
[env:c5test]
board = esp32-c5-devkitc-1
build_src_filter = +<c5test/>
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
