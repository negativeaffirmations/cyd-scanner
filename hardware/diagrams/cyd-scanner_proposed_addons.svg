<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box   { fill:#ffffff; stroke:#334155; stroke-width:1.5; }
    .lbl   { fill:#1f2937; font-size:13px; }
    .lblb  { fill:#1f2937; font-size:13px; font-weight:600; }
    .pin   { fill:#1f2937; font-size:11px; }
    .note  { fill:#475569; font-size:11px; }
    .pindot{ fill:#334155; }
    .wire  { fill:none; stroke:#64748b; stroke-width:2; }
    .link  { fill:none; stroke:#2563eb; stroke-width:2; }
    .prop  { fill:none; stroke:#dc2626; stroke-width:2.5; stroke-dasharray:7 5; }
    .propo { fill:none; stroke:#f87171; stroke-width:2;   stroke-dasharray:4 5; }
    .t5v   { fill:#ea580c; }
    .tgnd  { fill:#111827; }
    .ttxt  { fill:#ffffff; font-size:10px; font-weight:700; }
    .wtag  { fill:#dc2626; font-size:10px; font-weight:600; }
  </style>

  <rect x="0" y="0" width="1180" height="660" fill="#eef0f2"/>

  <!-- title + proposed banner -->
  <text x="20" y="26" font-size="18" font-weight="700" fill="#0f172a">cyd-scanner — PROPOSED add-ons (Build C): battery monitor on CYD + GPS on C5</text>
  <rect x="20" y="38" width="560" height="22" rx="4" fill="#fde2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="30" y="53" font-size="12" font-weight="700" fill="#b91c1c">⚠ NOT BUILT — design reference only. Do NOT change the link protocol until approved.</text>

  <!-- ===================== POWER CHAIN (existing, shown for context) ===================== -->
  <!-- Battery -->
  <rect class="box" x="30" y="80" width="150" height="50" rx="5"/>
  <text class="lblb" x="105" y="100" text-anchor="middle">LiPo 3.7V</text>
  <text class="lbl"  x="105" y="118" text-anchor="middle">5000 mAh</text>
  <circle class="pindot" cx="180" cy="95"  r="3"/><text class="pin" x="172" y="92">+</text>
  <circle class="pindot" cx="180" cy="117" r="3"/><text class="pin" x="170" y="121">−</text>

  <!-- TP4056 -->
  <rect class="box" x="210" y="70" width="150" height="92" rx="5"/>
  <text class="lblb" x="285" y="112" text-anchor="middle">TP4056</text>
  <text class="lbl"  x="285" y="128" text-anchor="middle">charger</text>
  <circle class="pindot" cx="210" cy="88"  r="3"/><text class="pin" x="216" y="92">B+</text>
  <circle class="pindot" cx="210" cy="140" r="3"/><text class="pin" x="216" y="144">B−</text>
  <circle class="pindot" cx="360" cy="84"  r="3"/><text class="pin" x="330" y="82" text-anchor="end">OUT+</text>
  <circle class="pindot" cx="360" cy="112" r="3"/><text class="pin" x="330" y="116" text-anchor="end">CHRG</text>
  <circle class="pindot" cx="360" cy="140" r="3"/><text class="pin" x="330" y="144" text-anchor="end">OUT−</text>

  <!-- Switch -->
  <rect class="box" x="398" y="74" width="78" height="40" rx="5"/>
  <text class="lbl" x="437" y="98" text-anchor="middle">SW</text>
  <circle class="pindot" cx="398" cy="94" r="3"/>
  <circle class="pindot" cx="476" cy="94" r="3"/>

  <!-- Boost -->
  <rect class="box" x="516" y="70" width="150" height="92" rx="5"/>
  <text class="lblb" x="591" y="110" text-anchor="middle">Boost</text>
  <text class="lbl"  x="591" y="126" text-anchor="middle">3.7→5V</text>
  <circle class="pindot" cx="516" cy="88"  r="3"/><text class="pin" x="522" y="92">IN+</text>
  <circle class="pindot" cx="516" cy="140" r="3"/><text class="pin" x="522" y="144">IN−</text>
  <circle class="pindot" cx="666" cy="88"  r="3"/><text class="pin" x="660" y="92" text-anchor="end">5V</text>
  <circle class="pindot" cx="666" cy="140" r="3"/><text class="pin" x="660" y="144" text-anchor="end">GND</text>

  <!-- power wires -->
  <polyline class="wire" points="180,95 210,88"/>
  <polyline class="wire" points="180,117 195,117 195,140 210,140"/>
  <polyline class="wire" points="360,84 379,84 379,94 398,94"/>           <!-- OUT+ -> switch -->
  <polyline class="wire" points="476,94 496,94 496,88 516,88"/>           <!-- switch -> IN+ (switched Vbat) -->
  <polyline class="wire" points="360,140 516,140"/>                        <!-- OUT- -> IN- -->
  <!-- boost 5V / GND to net tags -->
  <polyline class="wire" points="666,88 700,88"/>
  <rect class="t5v"  x="700" y="80" width="26" height="16" rx="3"/><text class="ttxt" x="713" y="92" text-anchor="middle">5V</text>
  <polyline class="wire" points="666,140 700,140"/>
  <rect class="tgnd" x="696" y="132" width="34" height="16" rx="3"/><text class="ttxt" x="713" y="144" text-anchor="middle">GND</text>

  <!-- ===================== PROPOSED: battery voltage divider ===================== -->
  <circle class="pindot" cx="496" cy="88" r="3.5" fill="#dc2626"/>          <!-- tap on switched Vbat -->
  <text class="wtag" x="408" y="178">batt voltage ÷2</text>
  <polyline class="prop" points="496,88 496,210"/>
  <rect x="476" y="210" width="40" height="22" rx="3" fill="#fff" stroke="#dc2626"/>
  <text class="pin" x="496" y="225" text-anchor="middle">R1 100k</text>
  <circle class="pindot" cx="496" cy="250" r="3.5" fill="#dc2626"/>         <!-- divider node -->
  <polyline class="prop" points="496,232 496,250"/>
  <rect x="476" y="258" width="40" height="22" rx="3" fill="#fff" stroke="#dc2626"/>
  <text class="pin" x="496" y="273" text-anchor="middle">R2 100k</text>
  <polyline class="prop" points="496,250 496,258"/>
  <polyline class="prop" points="496,280 496,300"/>
  <rect class="tgnd" x="479" y="300" width="34" height="16" rx="3"/><text class="ttxt" x="496" y="312" text-anchor="middle">GND</text>
  <!-- node -> CYD GPIO35 -->
  <polyline class="prop" points="496,250 760,250 760,242 788,242"/>

  <!-- PROPOSED: CHRG -> CYD GPIO26 -->
  <text class="wtag" x="300" y="185">charge status</text>
  <polyline class="prop" points="360,112 374,112 374,196 744,196 744,268 788,268"/>

  <!-- ===================== CYD ===================== -->
  <rect class="box" x="818" y="90" width="320" height="195" rx="6"/>
  <text class="lblb" x="978" y="112" text-anchor="middle">ESP32-2432S028R  (CYD) — host</text>
  <!-- left pins (dot at x=788, stub to box edge 818) -->
  <g>
    <circle class="pindot" cx="788" cy="130" r="3"/><line class="wire" x1="788" y1="130" x2="818" y2="130"/><text class="pin" x="824" y="134">VIN</text>
    <rect class="t5v"  x="755" y="122" width="26" height="16" rx="3"/><text class="ttxt" x="768" y="134" text-anchor="middle">5V</text>
    <circle class="pindot" cx="788" cy="160" r="3"/><line class="wire" x1="788" y1="160" x2="818" y2="160"/><text class="pin" x="824" y="164">GND</text>
    <rect class="tgnd" x="747" y="152" width="34" height="16" rx="3"/><text class="ttxt" x="764" y="164" text-anchor="middle">GND</text>
    <circle class="pindot" cx="788" cy="190" r="3"/><line class="wire" x1="788" y1="190" x2="818" y2="190"/><text class="pin" x="824" y="194">GPIO22  (link TX)</text>
    <circle class="pindot" cx="788" cy="216" r="3"/><line class="wire" x1="788" y1="216" x2="818" y2="216"/><text class="pin" x="824" y="220">GPIO27  (link RX)</text>
    <circle class="pindot" cx="788" cy="242" r="3" fill="#dc2626"/>
    <circle class="pindot" cx="788" cy="268" r="3" fill="#dc2626"/>
  </g>
  <text class="pin" x="824" y="246" fill="#b91c1c">GPIO35  (batt V, ADC1)</text>
  <text class="pin" x="824" y="272" fill="#b91c1c">GPIO26  (CHRG)</text>

  <!-- ===================== ESP32-C5 ===================== -->
  <rect class="box" x="818" y="350" width="300" height="215" rx="6"/>
  <text class="lblb" x="968" y="372" text-anchor="middle">ESP32-C5 DevKit — co-proc</text>
  <g>
    <circle class="pindot" cx="788" cy="390" r="3"/><line class="wire" x1="788" y1="390" x2="818" y2="390"/><text class="pin" x="824" y="394">5V0</text>
    <rect class="t5v"  x="755" y="382" width="26" height="16" rx="3"/><text class="ttxt" x="768" y="394" text-anchor="middle">5V</text>
    <circle class="pindot" cx="788" cy="420" r="3"/><line class="wire" x1="788" y1="420" x2="818" y2="420"/><text class="pin" x="824" y="424">GND</text>
    <rect class="tgnd" x="747" y="412" width="34" height="16" rx="3"/><text class="ttxt" x="764" y="424" text-anchor="middle">GND</text>
    <circle class="pindot" cx="788" cy="450" r="3"/><line class="wire" x1="788" y1="450" x2="818" y2="450"/><text class="pin" x="824" y="454">GPIO4  (link RX)</text>
    <circle class="pindot" cx="788" cy="476" r="3"/><line class="wire" x1="788" y1="476" x2="818" y2="476"/><text class="pin" x="824" y="480">GPIO5  (link TX)</text>
    <circle class="pindot" cx="788" cy="512" r="3" fill="#dc2626"/>
    <circle class="pindot" cx="788" cy="540" r="3" fill="#dc2626"/>
  </g>
  <text class="pin" x="824" y="516" fill="#b91c1c">GPIO15  (UART1 RX ← GPS)</text>
  <text class="pin" x="824" y="544" fill="#b91c1c">GPIO23  (UART1 TX → GPS, opt)</text>

  <!-- link wires CYD<->C5 (existing) -->
  <polyline class="link" points="788,190 745,190 745,450 788,450"/>
  <polyline class="link" points="788,216 735,216 735,476 788,476"/>
  <text class="pin" x="712" y="330" fill="#2563eb" transform="rotate(-90 712 330)">C5 link (UART)</text>

  <!-- ===================== PROPOSED: GPS module ===================== -->
  <rect class="box" x="470" y="430" width="170" height="120" rx="6" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text class="lblb" x="555" y="452" text-anchor="middle" fill="#b91c1c">GY-NEO6MV2</text>
  <text class="lbl"  x="555" y="468" text-anchor="middle" fill="#b91c1c">GPS (NEO-6M)</text>
  <circle class="pindot" cx="640" cy="484" r="3"/><text class="pin" x="634" y="488" text-anchor="end">VCC</text>
  <rect class="t5v"  x="648" y="476" width="26" height="16" rx="3"/><text class="ttxt" x="661" y="488" text-anchor="middle">5V</text>
  <circle class="pindot" cx="640" cy="506" r="3"/><text class="pin" x="634" y="510" text-anchor="end">GND</text>
  <rect class="tgnd" x="648" y="498" width="34" height="16" rx="3"/><text class="ttxt" x="665" y="510" text-anchor="middle">GND</text>
  <circle class="pindot" cx="640" cy="528" r="3" fill="#dc2626"/><text class="pin" x="634" y="532" text-anchor="end">TXD</text>
  <circle class="pindot" cx="640" cy="548" r="3" fill="#dc2626"/><text class="pin" x="634" y="552" text-anchor="end" fill="#b91c1c" opacity="0.8">RXD</text>
  <!-- GPS TXD -> C5 GPIO15 ; GPS RXD(opt) -> C5 GPIO23 -->
  <polyline class="prop"  points="640,528 712,528 712,512 788,512"/>
  <polyline class="propo" points="640,548 700,548 700,540 788,540"/>
  <text class="wtag" x="470" y="576">GPS → C5 (NMEA 9600; RXD optional)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="20" y="596" width="1140" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <line class="wire" x1="34" y1="614" x2="70" y2="614"/><text class="note" x="78" y="618">existing / in-use wiring</text>
  <line class="link" x1="240" y1="614" x2="276" y2="614"/><text class="note" x="284" y="618">CYD↔C5 link</text>
  <line class="prop" x1="400" y1="614" x2="436" y2="614"/><text class="note" x="444" y="618">PROPOSED (not built)</text>
  <line class="propo" x1="640" y1="614" x2="676" y2="614"/><text class="note" x="684" y="618">PROPOSED optional</text>
  <rect class="t5v" x="880" y="606" width="22" height="14" rx="3"/><rect class="tgnd" x="908" y="606" width="26" height="14" rx="3"/>
  <text class="note" x="940" y="618">net tags: same name = wired together (5 V / GND buses)</text>
  <text class="note" x="34" y="636">Spec: hardware/addon-wiring.md &amp; PINOUT.md §5.  Battery = CYD-only (no protocol change).  GPS-on-C5 needs a future PROTOCOL_VERSION 8→9 frame — hold until approved.</text>
</svg>
