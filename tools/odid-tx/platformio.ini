; ODID-TX — standalone bench tool: an OpenDroneID / ASTM F3411 BLE transmitter on a spare ESP32-S3.
; NOT part of the cyd-scanner two-board build (its own project dir, its own env) — kept out of the
; root platformio.ini so it can't be clobbered by the IDE or pulled into the cyd/c5 builds.
;
; Flash the spare ESP32-S3-DevKitC-1 (N16R8) via its NATIVE USB-C port (VID:PID 303A:1001):
;   pio run -d tools/odid-tx -t upload --upload-port COMxx
;   pio device monitor -p COMxx -b 115200
; It broadcasts BLE4 legacy adverts carrying 0xFFFA service data in the framing the scanner's C5
; decoder expects (src/c5/remoteid.*). See tools/odid-tx/README.md.
[env:odidtx]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.0
; Native USB (USB-Serial/JTAG) console + auto-download flashing, mirroring the c5 env.
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
