; fleet-sniff: standalone bench tool. Receive-only ESP-NOW capture on an ESP32-C5, used to check what the fleet
; link really puts on air (docs/fleet-mode.md). NOT part of the scanner build. See README.md.
;   pio run -d tools/fleet-sniff -t upload --upload-port COMxx
[platformio]
default_envs = fleetsniff

[env:fleetsniff]
build_src_filter = +<main.cpp>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c5-devkitc-1
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Shows the address a BLE scanner really sends (see README.md):  pio run -d tools/fleet-sniff -e scanreq -t upload --upload-port COMxx
[env:scanreq]
build_src_filter = +<scanreq.cpp>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c5-devkitc-1
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_BT_NIMBLE_EXT_ADV=1
