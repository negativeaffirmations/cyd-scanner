; fleet-sniff: standalone bench tool. Receive-only ESP-NOW capture on an ESP32-C5, used to check what the fleet
; link really puts on air (docs/fleet-mode.md). NOT part of the scanner build. See README.md.
;   pio run -d tools/fleet-sniff -t upload --upload-port COMxx
[env:fleetsniff]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c5-devkitc-1
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
