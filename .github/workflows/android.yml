# Actions are pinned to commit SHAs (tag in the comment); update them deliberately.
# Builds the COINTEL-FLO Android app (android-app/, docs/android-app.md), signs it with the release key held in the
# repo's secrets, and publishes it as a GitHub release tagged app-0.1.<n>. Obtainium on the phone watches those releases.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write   # create the release

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build number. Android refuses an update whose versionCode is not higher, so never reset it:
      # renaming this workflow restarts run_number, hence the offset you can raise if that ever happens.
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      # The committed gradle-wrapper.jar runs with the signing secrets around: check it is a genuine Gradle release.
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c   # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install Capacitor
        working-directory: android-app
        run: npm ci --no-fund --no-audit

      - name: Test the Bluetooth stand-in (mock plugin)
        working-directory: android-app
        run: npm test

      - name: Bundle the web app
        working-directory: android-app
        run: npm run sync

      - name: Build and sign
        working-directory: android-app/android
        env:
          CFLO_KEYSTORE_B64: ${{ secrets.CFLO_KEYSTORE_B64 }}
          CFLO_KEYSTORE_PASSWORD: ${{ secrets.CFLO_KEYSTORE_PASSWORD }}
          CFLO_KEY_PASSWORD: ${{ secrets.CFLO_KEYSTORE_PASSWORD }}
          CFLO_KEY_ALIAS: ${{ secrets.CFLO_KEY_ALIAS }}
        run: |
          export CFLO_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$CFLO_KEYSTORE_B64" | base64 -d > "$CFLO_KEYSTORE"
          chmod +x gradlew
          trap 'rm -f "$CFLO_KEYSTORE"' EXIT   # remove the key even when the build fails
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cointel-flo-$APP_VERSION_CODE.apk"

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/cointel-flo-$APP_VERSION_CODE.apk" | tee "$RUNNER_TEMP/cert.txt"
          grep -q "CN=COINTEL-FLO" "$RUNNER_TEMP/cert.txt"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$APP_VERSION_CODE
          SUBJECT=$(git log -1 --format=%s)
          {
            echo "COINTEL-FLO build $N (version 0.1.$N), commit ${GITHUB_SHA::7}"
            echo
            echo "$SUBJECT"
            echo
            echo "Install and update with Obtainium (docs/android-app.md)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "app-0.1.$N" "$RUNNER_TEMP/cointel-flo-$N.apk" \
            --target "$GITHUB_SHA" --title "COINTEL-FLO build $N" --notes-file "$RUNNER_TEMP/notes.md"
